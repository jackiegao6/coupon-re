[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couponim-experience"
version = "0.1.0"
description = "Streaming reverse sampling for coupon influence maximization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "psutil>=5.9,<8"]

[project.scripts]
couponim = "couponim.cli:main"

[tool.setuptools.packages.find]
include = ["couponim*"]

[tool.setuptools.package-data]
couponim = ["cpp/*.cpp", "cpp/*.hpp", "cpp/CMakeLists.txt"]
